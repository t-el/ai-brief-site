# Build the Hugo site and deploy it to GitHub Pages.
# Triggered by any push to main — including the daily commit made by the n8n workflow.
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.1"
      HUGO_ENVIRONMENT: production
      TZ: Africa/Casablanca
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Theme is fetched at build time from the upstream repo, pinned to a commit
      # (equivalent to a submodule, but needs no gitlink in this repo).
      - name: Checkout PaperMod theme (pinned)
        uses: actions/checkout@v7
        with:
          repository: adityatelange/hugo-PaperMod
          ref: 118119693d8b5ac211b939775678310973bcb232
          path: themes/PaperMod

      - name: Generate default OpenGraph image
        run: |
          mkdir -p static/images
          if [ -f static/images/og-default.png ]; then exit 0; fi
          convert -size 1200x630 xc:'#111827' \
            -fill white -font DejaVu-Sans-Bold -pointsize 92 -annotate +80+300 'AI Brief Daily' \
            -fill '#cbd5e1' -pointsize 44 -annotate +80+390 'Deep, sourced daily reports on AI' \
            -fill '#6366f1' -draw 'rectangle 0,600 1200,630' static/images/og-default.png

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        run: |
          hugo --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
